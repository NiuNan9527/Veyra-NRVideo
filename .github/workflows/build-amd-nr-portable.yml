name: Build AMD NR portable

on:
  push:
    branches: [amd-nr-v2.0.2]
    paths-ignore:
      - ".github/workflows/amd-nr-smoke.yml"
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout Veyra AMD NR branch
        uses: actions/checkout@v4

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir C:\Qt
          "QT_ROOT=C:\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage public SDK build interfaces
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party_local\nvidia | Out-Null
          git clone https://github.com/NVIDIA/DLSS.git third_party_local/nvidia/DLSS_SDK_310.7.0
          git -C third_party_local/nvidia/DLSS_SDK_310.7.0 checkout 374959484e79a640feaba44c93ac8cfb0a03f5b5
          git clone https://github.com/mbucchia/Optical-Flow-SDK.git third_party_local/nvidia/Optical_Flow_SDK_5.0.7
          git -C third_party_local/nvidia/Optical_Flow_SDK_5.0.7 checkout 54e68293b4898a530bc07e4d7df71efbc5d30f9b
          git clone --branch n13.0.19.0 --depth 1 https://github.com/FFmpeg/nv-codec-headers.git third_party_local/nvidia/nv-codec-headers-13.0

      - name: Build FFmpeg 9.0.1 development/runtime dependencies
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\veyra-vcpkg
          git -C C:\veyra-vcpkg checkout 36677bbd0b3bf11da7376e62e14bffcc54d2eaeb
          & C:\veyra-vcpkg\bootstrap-vcpkg.bat -disableMetrics
          & C:\veyra-vcpkg\vcpkg.exe install "ffmpeg[core,avcodec,avformat,swresample,swscale,dav1d]:x64-windows"
          "FFMPEG_ROOT=C:\veyra-vcpkg\installed\x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build lmxxf runtime DLL
        shell: pwsh
        run: |
          git clone https://github.com/lmxxf/dlss5-on-amd-9070xt-porting.git out/lmxxf-src
          git -C out/lmxxf-src checkout 9ec741522d267c4d2365af53081716fb2943068a
          $gxx=(Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          if(-not $gxx){
            choco install mingw -y --no-progress
            $gxx=(Get-Command g++.exe).Source
          }
          $env:LMXXF_GXX=$gxx
          Push-Location out/lmxxf-src
          cmd /c "scripts\build-runtime.cmd ..\lmxxf-bin"
          if($LASTEXITCODE -ne 0){ throw "LmxxfNrRuntime.dll build failed: $LASTEXITCODE" }
          Pop-Location

      - name: Configure Veyra AMD NR portable
        shell: pwsh
        run: |
          cmake -S . -B out/amd-nr-full -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DVEYRA_BUILD_QML_UI=ON `
            -DVEYRA_ENABLE_EXPERIMENTAL_DLSSNR=ON `
            -DVEYRA_ENABLE_NVOF=ON `
            -DVEYRA_ENABLE_REMOTEPLAY=OFF `
            -DVEYRA_ENABLE_MOONLIGHT=OFF `
            -DVEYRA_ENABLE_XBOX=OFF `
            -DVEYRA_ENABLE_DLSS_SR=OFF `
            -DVEYRA_ENABLE_DLSS_FG=OFF `
            -DVEYRA_ENABLE_D3D12_DEBUG=OFF `
            -DVEYRA_FFMPEG_ROOT="$env:FFMPEG_ROOT" `
            -DVEYRA_DLSS_SDK_ROOT="$PWD\third_party_local\nvidia\DLSS_SDK_310.7.0" `
            -DVEYRA_NVOF_SDK_ROOT="$PWD\third_party_local\nvidia\Optical_Flow_SDK_5.0.7" `
            -DVEYRA_NVENC_HEADERS_ROOT="$PWD\third_party_local\nvidia\nv-codec-headers-13.0" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT"

      - name: Build Veyra QML executable
        shell: pwsh
        run: |
          cmake --build out/amd-nr-full --target veyra_qml_ui --parallel 2

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $pkg="$PWD\dist\Veyra-2.0.2-AMD-NR-portable"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "out\amd-nr-full\veyra_qml_ui.exe" "$pkg\Veyra-AMD-NR.exe" -Force
          if(Test-Path "out\amd-nr-full\qml"){ Copy-Item "out\amd-nr-full\qml" "$pkg\qml" -Recurse -Force }
          elseif(Test-Path "qml"){ Copy-Item "qml" "$pkg\qml" -Recurse -Force }
          if(Test-Path "out\amd-nr-full\shaders"){ Copy-Item "out\amd-nr-full\shaders" "$pkg\shaders" -Recurse -Force }

          & "$env:QT_ROOT\bin\windeployqt.exe" --release --qmldir "$PWD\qml" "$pkg\Veyra-AMD-NR.exe"
          if($LASTEXITCODE -ne 0){ throw "windeployqt failed: $LASTEXITCODE" }

          Get-ChildItem "$env:FFMPEG_ROOT\bin\*.dll" | Copy-Item -Destination $pkg -Force

          $amd="$pkg\runtime\experimental\amd-lmxxf"
          New-Item -ItemType Directory -Force $amd | Out-Null
          Copy-Item "out\lmxxf-bin\LmxxfNrRuntime.dll" "$amd\LmxxfNrRuntime.dll" -Force
          Copy-Item "out\lmxxf-src\LICENSE" "$amd\lmxxf-MIT.txt" -Force

          @'
Veyra 2.0.2 AMD lmxxf NR experimental portable

The MIT lmxxf runtime DLL is included.
Neural assets/weights are NOT redistributed here.

To enable AMD NR:
1. Find an existing working dlss5-on-amd package on your PC.
2. Open its: DLSS5-AMD\native-game-tiled-assets
3. Copy ALL CONTENTS of native-game-tiled-assets into this folder:
   runtime\experimental\amd-lmxxf
   (so this folder contains HIP\SHA256SUMS, .hsaco modules, weights, noise.f32 and codec HLSL files)
4. Start Veyra-AMD-NR.exe.
5. In the NR runtime selector choose: AMD RDNA4 · lmxxf.
6. First test: SDR, one NR layer, strength around 1.0.

This build intentionally does not bundle NVIDIA neural weights.
'@ | Set-Content "$amd\README_IMPORT_ASSETS.txt" -Encoding utf8

          @'
@echo off
chcp 65001 >nul
set "SRC=%~1"
if "%SRC%"=="" (
  echo 请把 native-game-tiled-assets 文件夹拖到这个 BAT 上。
  pause
  exit /b 2
)
if not exist "%SRC%\HIP\SHA256SUMS" (
  echo 选错文件夹：找不到 HIP\SHA256SUMS
  pause
  exit /b 3
)
set "DST=%~dp0runtime\experimental\amd-lmxxf"
robocopy "%SRC%" "%DST%" /E /R:1 /W:1
if errorlevel 8 (
  echo 导入失败。
  pause
  exit /b 4
)
echo.
echo AMD NR 资源导入完成。
echo 现在双击 Veyra-AMD-NR.exe，NR 版本选择 AMD RDNA4 - lmxxf。
pause
'@ | Set-Content "$pkg\导入AMD_NR资源.bat" -Encoding ascii

          Copy-Item "LICENSE" "$pkg\LICENSE-Veyra-GPL3.txt" -Force
          if(Test-Path "THIRD_PARTY_NOTICES.md"){ Copy-Item "THIRD_PARTY_NOTICES.md" $pkg -Force }
          @'
这是实验性 AMD NR 直用版。
第一次使用只需要：
1. 把你现有 AMD DLSS5 包里的 native-game-tiled-assets 文件夹拖到 “导入AMD_NR资源.bat” 上；
2. 双击 Veyra-AMD-NR.exe；
3. NR 版本选择 “AMD RDNA4 · lmxxf”。
建议第一次只开单层 NR、SDR、强度 1.0。
'@ | Set-Content "$pkg\先看我.txt" -Encoding utf8

          Get-ChildItem $pkg | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload direct-use portable
        uses: actions/upload-artifact@v4
        with:
          name: Veyra-2.0.2-AMD-NR-portable
          path: dist/Veyra-2.0.2-AMD-NR-portable
          if-no-files-found: error
          compression-level: 6
